<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gungun Sharma</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --main: #0C447C;
    --text: #1A1A18;
    --bg: #FAFAF8;
    --accent: #D85A30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    text-align: center;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 3.5rem);
    letter-spacing: -0.02em;
  }
  p {
    margin-top: 12px;
    font-size: 1.05rem;
    color: #5F5E5A;
  }
  .accent {
    color: var(--accent);
  }
  .mark {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: var(--main);
    color: var(--bg);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
</style>
</head>
<body>
  <main>
    <div class="mark">GS</div>
    <h1>Gungun Sharma<span class="accent">.</span></h1>
    <p>Portfolio coming soon — built with AI, shipped with judgment.</p>
  </main>
</body>
</html>
